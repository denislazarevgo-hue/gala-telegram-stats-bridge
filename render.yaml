services:
  - type: web
    name: gala-telegram-stats-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: TELEGRAM_BRIDGE_TOKEN
        generateValue: true
      - key: REQUEST_TIMEOUT_SECONDS
        value: 25
      - key: TELEGRAM_BATCH_CHUNK_SIZE
        value: 100
